<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VYBE — Join</title><link rel="stylesheet" href="style.css"><script src="theme.js"></script></head><body class="auth-page"><div class="auth-shell"><div class="auth-brand"><div class="brand-icon">✦</div><div><h1>VYBE</h1><span>Make your corner of the internet.</span></div></div><section class="auth-card"><div class="auth-copy"><p class="hero-tag">✦ JOIN THE COMMUNITY</p><h2>Bring your VYBE.</h2><p>Create a profile, meet people and share what matters to you.</p></div><form id="registerForm" class="auth-form"><label>Full name<input id="registerName" placeholder="Your name" required></label><label>Username<input id="registerUsername" placeholder="yourusername" required></label><label>Email<input id="registerEmail" type="email" placeholder="you@example.com" required></label><label>Password<input id="registerPassword" type="password" minlength="6" placeholder="At least 6 characters" required></label><label>Confirm password<input id="registerConfirm" type="password" placeholder="Repeat password" required></label><button class="primary-btn" type="submit">Create my VYBE →</button><p id="authMessage" class="form-message"></p></form><p class="auth-switch">Already a member? <a href="login.html">Log in</a></p></section></div><script src="auth.js" defer></script></body></html>
