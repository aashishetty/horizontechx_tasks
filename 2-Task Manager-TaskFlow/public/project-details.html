<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TaskFlow | Project Details</title>

   <style>
    /* ========================================
   TASKFLOW - PROJECT DETAILS
   DARK THEME
======================================== */


/* ========================================
   PAGE
======================================== */

.details-page {
    max-width: 1150px;
    margin: 0 auto;
    padding: 40px;
    color: #f8fafc;
}


/* ========================================
   BACK BUTTON
======================================== */

.back-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 22px;

    color: #94a3b8;
    text-decoration: none;

    font-size: 14px;
    font-weight: 600;

    transition: .2s;
}

.back-link:hover {
    color: #a855f7;
}


/* ========================================
   PROJECT HERO
======================================== */

.project-hero {
    background: #0f1020;

    border: 1px solid #27283a;
    border-radius: 22px;

    overflow: hidden;

    box-shadow:
        0 12px 35px rgba(0, 0, 0, .25);

    margin-bottom: 25px;
}

.project-color-bar {
    height: 9px;
    background: #8b5cf6;
}

.project-hero-content {
    padding: 28px 30px;
}

.project-hero-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    gap: 20px;
}

.project-title-area {
    display: flex;
    gap: 16px;
    align-items: flex-start;
}

.project-icon {
    width: 58px;
    height: 58px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 16px;

    background: rgba(139, 92, 246, .15);
    color: #a855f7;

    font-size: 24px;
    font-weight: 800;
}

.project-title-area h1 {
    margin: 0 0 7px;

    font-size: 30px;

    color: #f8fafc;
}

.project-title-area p {
    margin: 0;

    max-width: 700px;

    color: #94a3b8;

    line-height: 1.6;
    font-size: 14px;
}


/* ========================================
   ACTION BUTTONS
======================================== */

.project-actions {
    display: flex;
    gap: 9px;
    flex-shrink: 0;
}

.project-action-btn {
    border: 1px solid #303145;

    background: #171827;
    color: #e2e8f0;

    padding: 10px 15px;

    border-radius: 10px;

    font-size: 13px;
    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

.project-action-btn:hover {
    border-color: #8b5cf6;

    background: rgba(139, 92, 246, .12);

    color: #c084fc;
}

.delete-project-btn:hover {
    border-color: #ef4444;

    background: rgba(239, 68, 68, .10);

    color: #f87171;
}


/* ========================================
   META TAGS
======================================== */

.project-meta {
    display: flex;
    flex-wrap: wrap;

    gap: 8px;

    margin-top: 22px;
}

.meta-tag {
    padding: 6px 11px;

    border-radius: 20px;

    background: #1a1b2b;
    color: #cbd5e1;

    font-size: 12px;
    font-weight: 700;

    border: 1px solid #292a3b;
}

.meta-tag.status {
    background: rgba(139, 92, 246, .15);
    color: #c084fc;

    border-color: rgba(139, 92, 246, .25);
}

.meta-tag.priority-high {
    background: rgba(239, 68, 68, .12);
    color: #f87171;

    border-color: rgba(239, 68, 68, .2);
}

.meta-tag.priority-medium {
    background: rgba(249, 115, 22, .12);
    color: #fb923c;

    border-color: rgba(249, 115, 22, .2);
}

.meta-tag.priority-low {
    background: rgba(16, 185, 129, .12);
    color: #34d399;

    border-color: rgba(16, 185, 129, .2);
}


/* ========================================
   MAIN GRID
======================================== */

.details-grid {
    display: grid;

    grid-template-columns:
        minmax(0, 1.6fr)
        minmax(280px, .8fr);

    gap: 24px;

    align-items: start;
}


/* ========================================
   DARK CARDS
======================================== */

.details-card {
    background: #0f1020;

    border: 1px solid #27283a;

    border-radius: 18px;

    padding: 24px;

    box-shadow:
        0 8px 28px rgba(0, 0, 0, .20);
}

.details-card + .details-card {
    margin-top: 20px;
}


/* ========================================
   CARD HEADINGS
======================================== */

.card-heading {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 20px;
}

.card-heading h2 {
    margin: 0;

    color: #f8fafc;

    font-size: 18px;
}

.card-heading span {
    color: #64748b;

    font-size: 12px;
}


/* ========================================
   PROGRESS
======================================== */

.progress-summary {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 10px;
}

.progress-summary span {
    color: #94a3b8;

    font-size: 13px;
}

.progress-summary strong {
    color: #f8fafc;

    font-size: 20px;
}

.progress-track {
    width: 100%;
    height: 11px;

    border-radius: 20px;

    background: #242536;

    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;

    background: #8b5cf6;

    border-radius: 20px;

    transition: width .3s ease;
}


/* ========================================
   INFO GRID
======================================== */

.info-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 18px;
}

.info-item {
    padding: 15px;

    border-radius: 12px;

    background: #171827;

    border: 1px solid #252638;
}

.info-item span {
    display: block;

    margin-bottom: 6px;

    color: #64748b;

    font-size: 11px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: .06em;
}

.info-item strong {
    color: #e2e8f0;

    font-size: 14px;
}


/* ========================================
   GOAL
======================================== */

.goal-box {
    padding: 16px;

    border-radius: 12px;

    background: #171827;

    border: 1px solid #252638;

    color: #cbd5e1;

    font-size: 14px;

    line-height: 1.6;
}

.empty-goal {
    color: #64748b;
}


/* ========================================
   CHECKLIST
======================================== */

.checklist-list {
    display: flex;

    flex-direction: column;

    gap: 10px;
}

.checklist-item {
    display: flex;

    align-items: center;

    gap: 12px;

    padding: 13px 14px;

    border: 1px solid #292a3b;

    border-radius: 12px;

    background: #151625;

    transition: .2s;
}

.checklist-item:hover {
    border-color: #7c3aed;

    background: rgba(124, 58, 237, .08);
}

.checklist-checkbox {
    width: 18px;
    height: 18px;

    accent-color: #8b5cf6;

    cursor: pointer;

    flex-shrink: 0;
}

.checklist-text {
    flex: 1;

    color: #cbd5e1;

    font-size: 14px;
}

.checklist-item.completed .checklist-text {
    color: #64748b;

    text-decoration: line-through;
}

.checklist-delete {
    border: none;

    background: transparent;

    color: #64748b;

    cursor: pointer;

    font-size: 16px;
}

.checklist-delete:hover {
    color: #f87171;
}


/* ========================================
   ADD CHECKLIST
======================================== */

.checklist-add {
    display: flex;

    gap: 8px;

    margin-top: 14px;
}

.checklist-add input {
    flex: 1;

    padding: 10px 12px;

    border: 1px solid #303145;

    border-radius: 9px;

    outline: none;

    background: #111221;

    color: #e2e8f0;

    font-family: inherit;
}

.checklist-add input::placeholder {
    color: #64748b;
}

.checklist-add input:focus {
    border-color: #8b5cf6;
}

.checklist-add button {
    border: none;

    background: #7c3aed;

    color: white;

    padding: 10px 15px;

    border-radius: 9px;

    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

.checklist-add button:hover {
    background: #8b5cf6;
}


/* ========================================
   EMPTY CHECKLIST
======================================== */

.empty-checklist {
    padding: 22px;

    text-align: center;

    background: #151625;

    border: 1px solid #252638;

    border-radius: 12px;

    color: #64748b;

    font-size: 13px;
}


/* ========================================
   PROJECT BOARD / TASK CARDS
======================================== */

.task-board {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
}

.task-board-column {
    min-width: 0;
    padding: 12px;
    border: 1px solid #27283a;
    border-radius: 14px;
    background: #0b0c16;
}

.task-board-column h3 {
    margin: 2px 2px 10px;
    color: #cbd5e1;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .7px;
}

.task-board-cards {
    display: flex;
    flex-direction: column;
    gap: 9px;
    min-height: 60px;
}

.task-item {
    display: grid;
    grid-template-columns: 30px minmax(0, 1fr);
    gap: 10px;
    padding: 12px;
    border: 1px solid #292a3b;
    border-radius: 12px;
    background: #151625;
    transition: .2s;
}

.task-item:hover {
    border-color: #7c3aed;
    background: rgba(124, 58, 237, .07);
}

.task-card-check {
    width: 28px;
    height: 28px;
    margin-top: 1px;
    border: 1px solid rgba(139, 92, 246, .3);
    border-radius: 8px;
    background: rgba(139, 92, 246, .08);
    color: #b7a8ff;
    cursor: pointer;
    font-weight: 800;
}

.task-card-check.done {
    border-color: rgba(34, 197, 94, .3);
    background: rgba(34, 197, 94, .1);
    color: #69dfa0;
}

.task-info strong {
    display: block;
    margin-bottom: 5px;
    color: #e2e8f0;
    font-size: 13px;
}

.task-info span {
    display: block;
    color: #64748b;
    font-size: 11px;
    line-height: 1.5;
}

.task-card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
}

.task-card-tag {
    padding: 4px 7px;
    border-radius: 6px;
    background: #242536;
    color: #cbd5e1;
    font-size: 9px;
    font-weight: 700;
}

.task-card-tag.high { color: #ff9eae; background: rgba(255, 80, 110, .1); }
.task-card-tag.medium { color: #c3a9ff; background: rgba(139, 92, 246, .11); }
.task-card-tag.low { color: #72c7ff; background: rgba(59, 130, 246, .1); }

.task-card-due {
    margin-top: 7px;
    color: #777d91;
    font-size: 9px;
}

.task-card-due.overdue {
    color: #ff7f96;
}

.no-tasks {
    padding: 25px;

    text-align: center;

    color: #64748b;

    font-size: 13px;

    background: #151625;

    border: 1px solid #252638;

    border-radius: 12px;
}


/* ========================================
   ADD TASK BUTTON
======================================== */

.add-task-btn {
    border: 1px solid #303145;

    background: #171827;

    color: #cbd5e1;

    padding: 8px 13px;

    border-radius: 9px;

    font-size: 12px;

    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

.add-task-btn:hover {
    background: rgba(124, 58, 237, .12);

    border-color: #7c3aed;

    color: #c084fc;
}


/* ========================================
   MEMBERS
======================================== */

.member-list {
    display: flex;

    flex-direction: column;

    gap: 12px;
}

.member-item {
    display: flex;

    align-items: center;

    gap: 11px;
}

.member-avatar {
    width: 35px;
    height: 35px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: rgba(139, 92, 246, .15);

    color: #c084fc;

    font-size: 12px;

    font-weight: 800;
}

.member-info strong {
    display: block;

    color: #e2e8f0;

    font-size: 13px;
}

.member-info span {
    color: #64748b;

    font-size: 11px;
}


/* ========================================
   LOADING / ERROR
======================================== */

.page-message {
    padding: 40px;

    text-align: center;

    color: #94a3b8;
}

.page-error {
    background: rgba(239, 68, 68, .10);

    border: 1px solid rgba(239, 68, 68, .25);

    color: #f87171;

    border-radius: 12px;

    padding: 15px;
}


/* ========================================
   EDIT MODAL
======================================== */

.modal-overlay {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0, 0, 0, .72);

    backdrop-filter: blur(6px);

    z-index: 9999;

    padding: 20px;
}

.modal-overlay.show {
    display: flex;
}

.edit-modal {
    width: 100%;
    max-width: 550px;

    max-height: 90vh;

    overflow-y: auto;

    background: #10111f;

    border: 1px solid #303145;

    border-radius: 18px;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, .5);

    padding: 25px;
}

.modal-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 20px;
}

.modal-header h2 {
    margin: 0;

    color: #f8fafc;

    font-size: 20px;
}

.close-modal {
    border: none;

    background: transparent;

    color: #94a3b8;

    font-size: 25px;

    cursor: pointer;
}

.close-modal:hover {
    color: #f8fafc;
}


/* ========================================
   EDIT FORM
======================================== */

.edit-form-group {
    margin-bottom: 16px;
}

.edit-form-group label {
    display: block;

    margin-bottom: 7px;

    color: #cbd5e1;

    font-size: 13px;

    font-weight: 700;
}

.edit-form-group input,
.edit-form-group textarea,
.edit-form-group select {
    width: 100%;

    box-sizing: border-box;

    padding: 11px 12px;

    border: 1px solid #303145;

    border-radius: 9px;

    background: #171827;

    color: #e2e8f0;

    outline: none;

    font-family: inherit;

    font-size: 13px;
}

.edit-form-group textarea {
    min-height: 100px;

    resize: vertical;
}

.edit-form-group input:focus,
.edit-form-group textarea:focus,
.edit-form-group select:focus {
    border-color: #8b5cf6;

    box-shadow:
        0 0 0 2px rgba(139, 92, 246, .12);
}

.edit-form-group select option {
    background: #171827;

    color: #e2e8f0;
}

.edit-form-group input[type="color"] {
    height: 42px;

    padding: 4px;

    cursor: pointer;
}


/* ========================================
   MODAL BUTTONS
======================================== */

.modal-actions {
    display: flex;

    justify-content: flex-end;

    gap: 10px;

    margin-top: 22px;
}

.cancel-button {
    border: 1px solid #303145;

    background: #171827;

    color: #cbd5e1;

    padding: 10px 16px;

    border-radius: 9px;

    font-weight: 700;

    cursor: pointer;
}

.cancel-button:hover {
    background: #242536;
}

.save-btn {
    border: none;

    background: #7c3aed;

    color: white;

    padding: 10px 17px;

    border-radius: 9px;

    font-weight: 700;

    cursor: pointer;
}

.save-btn:hover {
    background: #8b5cf6;
}


/* ========================================
   FORM MESSAGE
======================================== */

.form-message {
    margin-top: 10px;

    font-size: 13px;
}

.form-message.error {
    color: #f87171;
}

.form-message.success {
    color: #34d399;
}


/* ========================================
   RESPONSIVE
======================================== */

@media (max-width: 900px) {
    .task-board {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 850px) {

    .details-grid {
        grid-template-columns: 1fr;
    }

}


@media (max-width: 650px) {

    .details-page {
        padding: 25px 18px;
    }

    .project-hero-top {
        flex-direction: column;
    }

    .project-actions {
        width: 100%;
    }

    .project-action-btn {
        flex: 1;
    }

    .info-grid {
        grid-template-columns: 1fr;
    }

}
    </style>

</head>

<div
    class="modal-overlay"
    id="editModal"
>

            <h2>
                Edit Project
            </h2>

            <button

                class="close-modal"

                ×

        </div>

                    Project Name

                <input
                    type="text"
                    id="editName"

                >

            </div>


            <div class="edit-form-group">

                <label for="editDescription">
                    Description
                </label>

                <textarea
                    id="editDescription"
                    required
                ></textarea>

            </div>


            <div class="edit-form-group">

                <label for="editCategory">
                    Category
                </label>

                <select
                    id="editCategory"
                    required
                >

                    <option
                        value=""
                        disabled
                    >
                        Select category
                    </option>

                    <option value="College">
                        College
                    </option>

                    <option value="Work">
                        Work
                    </option>

                    <option value="Personal">
                        Personal
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="edit-form-group">

                <label for="editPriority">
                    Priority
                </label>

                <select
                    id="editPriority"
                    required
                >

                    <option
                        value=""
                        disabled
                    >
                        Select priority
                    </option>

                    <option value="Low">
                        Low
                    </option>

                    <option value="Medium">
                        Medium
                    </option>

                    <option value="High">
                        High
                    </option>

                </select>

            </div>


            <div class="edit-form-group">

                <label for="editStatus">
                    Status
                </label>

                <select
                    id="editStatus"
                    required
                >

                    <option
                        value=""
                        disabled
                    >
                        Select status
                    </option>

                    <option value="Planning">
                        Planning
                    </option>

                    <option value="In Progress">
                        In Progress
                    </option>

                    <option value="On Hold">
                        On Hold
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                </select>

            </div>


            <div class="edit-form-group">

                <label for="editStartDate">
                    Start Date
                </label>

                <input
                    type="date"
                    id="editStartDate"
                >

            </div>


            <div class="edit-form-group">

                <label for="editDueDate">
                    Due Date
                </label>

                <input
                    type="date"
                    id="editDueDate"
                >

            </div>


            <div class="edit-form-group">

                <label for="editColor">
                    Project Color
                </label>

                <input
                    type="color"
                    id="editColor"
                >

            </div>


            <div
                id="editMessage"
                class="form-message"
            ></div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-button"
                    id="cancelEdit"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>


<script>

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        /* ========================================
           GET USER
        ======================================== */

        const storedUser =
            localStorage.getItem(
                "taskflowUser"
            );


        if (!storedUser) {

            window.location.href =
                "/login.html";

            return;

        }


        let currentUser;


        try {

            currentUser =
                JSON.parse(
                    storedUser
                );

        } catch (error) {

            localStorage.removeItem(
                "taskflowUser"
            );

            window.location.href =
                "/login.html";

            return;

        }


        const userName =
            document.querySelector(
                "#userName"
            );


        const userUsername =
            document.querySelector(
                "#userUsername"
            );


        const userAvatar =
            document.querySelector(
                "#userAvatar"
            );


        const currentName =
            currentUser.name ||
            currentUser.username ||
            "User";


        if (userName) {

            userName.textContent =
                currentName;

        }


        if (userUsername) {

            userUsername.textContent =
                currentUser.username
                    ? `@${currentUser.username}`
                    : "";

        }


        if (userAvatar) {

            userAvatar.textContent =
                currentName
                    .charAt(0)
                    .toUpperCase();

        }


        /* ========================================
           GET PROJECT ID
        ======================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const projectId =
            params.get("id");


        const pageContent =
            document.querySelector(
                "#pageContent"
            );


        if (!projectId) {

            pageContent.innerHTML = `

                <div class="page-error">
                    Project ID is missing.
                </div>

            `;

            return;

        }


        /* ========================================
           FORMAT DATE
        ======================================== */

        function formatDate(
            dateString
        ) {

            if (!dateString) {
                return "Not set";
            }


            const date =
                new Date(dateString);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "Not set";

            }


            return date.toLocaleDateString(
                "en-IN",
                {
                    day: "numeric",
                    month: "short",
                    year: "numeric"
                }
            );

        }


        /* ========================================
           ESCAPE HTML
        ======================================== */

        function escapeHTML(
            value
        ) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                value == null
                    ? ""
                    : String(value);

            return div.innerHTML;

        }


        /* ========================================
           LOAD PROJECT
        ======================================== */

        async function loadProject() {

            try {

                const response =
                    await fetch(
                        `/api/projects/${encodeURIComponent(projectId)}`
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Could not load project."
                    );

                }


                renderProject(
                    data.project
                );


            } catch (error) {

                console.error(
                    "Load project error:",
                    error
                );


                pageContent.innerHTML = `

                    <div class="page-error">
                        ${escapeHTML(
                            error.message ||
                            "Could not load project."
                        )}
                    </div>

                `;

            }

        }


        /* ========================================
           CHECKLIST UPDATE
        ======================================== */

        async function updateChecklist(
            id,
            checklist
        ) {

            try {

                const response =
                    await fetch(
                        `/api/projects/${encodeURIComponent(id)}/checklist`,
                        {

                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    checklist
                                })

                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Could not update checklist."
                    );

                }


                return data.project;


            } catch (error) {

                console.error(
                    "Checklist update error:",
                    error
                );


                alert(
                    "Could not update the checklist."
                );


                return null;

            }

        }


        /* ========================================
           UPDATE PROGRESS DISPLAY
        ======================================== */

        function updateProgressDisplay(
            project
        ) {

            const progress =
                project.progress || 0;


            const progressText =
                document.querySelector(
                    ".progress-summary strong"
                );


            const progressFill =
                document.querySelector(
                    ".progress-fill"
                );


            if (progressText) {

                progressText.textContent =
                    `${progress}%`;

            }


            if (progressFill) {

                progressFill.style.width =
                    `${progress}%`;


                progressFill.style.background =
                    project.color ||
                    "#7c3aed";

            }

        }


        /* ========================================
           RENDER CHECKLIST
        ======================================== */

        function renderChecklist(
            project
        ) {

            const checklistList =
                document.querySelector(
                    "#checklistList"
                );


            const checklistProgress =
                document.querySelector(
                    "#checklistProgress"
                );


            if (!checklistList) {
                return;
            }


            const checklist =
                Array.isArray(
                    project.checklist
                )
                    ? project.checklist
                    : [];


            const completed =
                checklist.filter(
                    item => item.completed
                ).length;


            const progress =
                checklist.length === 0
                    ? 0
                    : Math.round(
                        (
                            completed /
                            checklist.length
                        ) * 100
                    );


            if (checklistProgress) {

                checklistProgress.textContent =
                    `${progress}%`;

            }


            if (!checklist.length) {

                checklistList.innerHTML = `

                    <div class="empty-checklist">
                        No checklist items added yet.
                    </div>

                `;

                return;

            }


            checklistList.innerHTML =
                checklist
                    .map(
                        (item, index) => `

                            <div
                                class="checklist-item ${
                                    item.completed
                                        ? "completed"
                                        : ""
                                }"
                            >

                                <input
                                    type="checkbox"
                                    class="checklist-checkbox"
                                    data-index="${index}"
                                    ${
                                        item.completed
                                            ? "checked"
                                            : ""
                                    }
                                >


                                <span class="checklist-text">

                                    ${escapeHTML(
                                        item.text
                                    )}

                                </span>


                                <button
                                    type="button"
                                    class="checklist-delete"
                                    data-index="${index}"
                                >
                                    ×
                                </button>

                            </div>

                        `
                    )
                    .join("");


            document
                .querySelectorAll(
                    ".checklist-checkbox"
                )
                .forEach(
                    checkbox => {

                        checkbox.addEventListener(
                            "change",
                            async function () {

                                const index =
                                    Number(
                                        this.dataset.index
                                    );


                                const updatedChecklist =
                                    checklist.map(
                                        (
                                            item,
                                            itemIndex
                                        ) =>
                                            itemIndex === index
                                                ? {
                                                    ...item,
                                                    completed:
                                                        this.checked
                                                }
                                                : item
                                    );


                                const updatedProject =
                                    await updateChecklist(
                                        project._id,
                                        updatedChecklist
                                    );


                                if (updatedProject) {

                                    renderChecklist(
                                        updatedProject
                                    );


                                    updateProgressDisplay(
                                        updatedProject
                                    );

                                }

                            }
                        );

                    }
                );


            document
                .querySelectorAll(
                    ".checklist-delete"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            async function () {

                                const index =
                                    Number(
                                        this.dataset.index
                                    );


                                const updatedChecklist =
                                    checklist.filter(
                                        (
                                            item,
                                            itemIndex
                                        ) =>
                                            itemIndex !== index
                                    );


                                const updatedProject =
                                    await updateChecklist(
                                        project._id,
                                        updatedChecklist
                                    );


                                if (updatedProject) {

                                    renderChecklist(
                                        updatedProject
                                    );


                                    updateProgressDisplay(
                                        updatedProject
                                    );

                                }

                            }
                        );

                    }
                );

        }


        /* ========================================
           SETUP CHECKLIST
        ======================================== */

        function setupChecklist(
            project
        ) {

            const addButton =
                document.querySelector(
                    "#addChecklistItem"
                );


            const input =
                document.querySelector(
                    "#newChecklistItem"
                );


            if (!addButton || !input) {
                return;
            }


            async function addItem() {

                const text =
                    input.value.trim();


                if (!text) {

                    alert(
                        "Please enter a checklist item."
                    );

                    return;

                }


                const currentChecklist =
                    Array.isArray(
                        project.checklist
                    )
                        ? project.checklist
                        : [];


                const updatedChecklist = [

                    ...currentChecklist,

                    {
                        text,
                        completed: false
                    }

                ];


                const updatedProject =
                    await updateChecklist(
                        project._id,
                        updatedChecklist
                    );


                if (updatedProject) {

                    input.value = "";


                    project =
                        updatedProject;


                    renderChecklist(
                        updatedProject
                    );


                    updateProgressDisplay(
                        updatedProject
                    );

                }

            }


            addButton.addEventListener(
                "click",
                addItem
            );


            input.addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key === "Enter"
                    ) {

                        event.preventDefault();

                        addItem();

                    }

                }
            );

        }


        /* ========================================
           RENDER PROJECT
        ======================================== */

        function renderProject(
            project
        ) {

            const color =
                project.color ||
                "#7c3aed";


            const firstLetter =
                (
                    project.name ||
                    "P"
                )
                    .charAt(0)
                    .toUpperCase();


            const priorityClass =
                project.priority === "High"
                    ? "priority-high"
                    : project.priority === "Low"
                        ? "priority-low"
                        : "priority-medium";


            const members =
                Array.isArray(
                    project.members
                )
                    ? project.members
                    : [];


            pageContent.innerHTML = `

                <!-- PROJECT HERO -->

                <div class="project-hero">

                    <div
                        class="project-color-bar"
                        style="background:${escapeHTML(color)}"
                    ></div>


                    <div class="project-hero-content">

                        <div class="project-hero-top">

                            <div class="project-title-area">

                                <div
                                    class="project-icon"
                                    style="
                                        background:${escapeHTML(color)}20;
                                        color:${escapeHTML(color)};
                                    "
                                >
                                    ${escapeHTML(
                                        firstLetter
                                    )}
                                </div>


                                <div>

                                    <h1>
                                        ${escapeHTML(
                                            project.name
                                        )}
                                    </h1>


                                    <p>
                                        ${escapeHTML(
                                            project.description
                                        )}
                                    </p>

                                </div>

                            </div>


                            <div class="project-actions">

                                <button
                                    type="button"
                                    class="project-action-btn"
                                    id="editProjectBtn"
                                >
                                    ✎ Edit
                                </button>


                                <button
                                    type="button"
                                    class="project-action-btn delete-project-btn"
                                    id="deleteProjectBtn"
                                >
                                    🗑 Delete
                                </button>

                            </div>

                        </div>


                        <div class="project-meta">

                            <span class="meta-tag">

                                ${escapeHTML(
                                    project.category ||
                                    "Other"
                                )}

                            </span>


                            <span
                                class="meta-tag ${priorityClass}"
                            >

                                ${escapeHTML(
                                    project.priority ||
                                    "Medium"
                                )}
                                Priority

                            </span>


                            <span class="meta-tag status">

                                ${escapeHTML(
                                    project.status ||
                                    "Planning"
                                )}

                            </span>

                        </div>

                    </div>

                </div>


                <!-- DETAILS GRID -->

                <div class="details-grid">


                    <!-- LEFT -->

                    <div>


                        <!-- PROGRESS -->

                        <div class="details-card">

                            <div class="card-heading">

                                <h2>
                                    Project Progress
                                </h2>

                            </div>


                            <div class="progress-summary">

                                <span>
                                    Overall completion
                                </span>

                                <strong>
                                    ${project.progress || 0}%
                                </strong>

                            </div>


                            <div class="progress-track">

                                <div
                                    class="progress-fill"
                                    style="
                                        width:${project.progress || 0}%;
                                        background:${escapeHTML(color)};
                                    "
                                ></div>

                            </div>

                        </div>


                        <!-- CHECKLIST -->

                        <div class="details-card">

                            <div class="card-heading">

                                <h2>
                                    Project To-Do List
                                </h2>

                                <span id="checklistProgress">
                                    0%
                                </span>

                            </div>


                            <div
                                id="checklistList"
                                class="checklist-list"
                            >

                                <div class="empty-checklist">
                                    No checklist items added yet.
                                </div>

                            </div>


                            <div class="checklist-add">

                                <input
                                    type="text"
                                    id="newChecklistItem"
                                    placeholder="What needs to be done?"
                                >

                                <button
                                    type="button"
                                    id="addChecklistItem"
                                >
                                    + Add
                                </button>

                            </div>

                        </div>


                        <!-- PROJECT INFO -->

                        <div class="details-card">

                            <div class="card-heading">

                                <h2>
                                    Project Information
                                </h2>

                            </div>


                            <div class="info-grid">

                                <div class="info-item">

                                    <span>
                                        Category
                                    </span>

                                    <strong>
                                        ${escapeHTML(
                                            project.category ||
                                            "Other"
                                        )}
                                    </strong>

                                </div>


                                <div class="info-item">

                                    <span>
                                        Priority
                                    </span>

                                    <strong>
                                        ${escapeHTML(
                                            project.priority ||
                                            "Medium"
                                        )}
                                    </strong>

                                </div>


                                <div class="info-item">

                                    <span>
                                        Start Date
                                    </span>

                                    <strong>
                                        ${formatDate(
                                            project.startDate
                                        )}
                                    </strong>

                                </div>


                                <div class="info-item">

                                    <span>
                                        Due Date
                                    </span>

                                    <strong>
                                        ${formatDate(
                                            project.dueDate
                                        )}
                                    </strong>

                                </div>

                            </div>

                        </div>


                        <!-- GOAL -->

                        <div class="details-card">

                            <div class="card-heading">

                                <h2>
                                    Project Goal
                                </h2>

                            </div>


                            <div class="
                                goal-box
                                ${
                                    project.goal
                                        ? ""
                                        : "empty-goal"
                                }
                            ">

                                ${escapeHTML(
                                    project.goal ||
                                    "No project goal added yet."
                                )}

                            </div>

                        </div>


                        <!-- TASKS -->

                        <div class="details-card">

                            <div class="card-heading">

                                <h2>
                                    Project Tasks
                                </h2>


                                <button
                                    type="button"
                                    class="add-task-btn"
                                    id="addTaskBtn"
                                >
                                    + Add Task
                                </button>

                            </div>


                            <div
                                id="taskList"
                                class="task-list"
                            >

                                <div class="no-tasks">
                                    Loading tasks...
                                </div>

                            </div>

                        </div>


                    </div>


                    <!-- RIGHT -->

                    <div>


                        <!-- STATUS -->

                        <div class="details-card">

                            <div class="card-heading">

                                <h2>
                                    Status
                                </h2>

                            </div>


                            <div class="info-item">

                                <span>
                                    Current Status
                                </span>

                                <strong>
                                    ${escapeHTML(
                                        project.status ||
                                        "Planning"
                                    )}
                                </strong>

                            </div>

                        </div>


                        <!-- MEMBERS -->

                        <div class="details-card">

                            <div class="card-heading">

                                <h2>
                                    Team Members
                                </h2>

                                <span>
                                    ${members.length}
                                </span>

                            </div>


                            <div class="member-list">

                                ${
                                    members.length
                                        ? members
                                            .map(
                                                member => `

                                                    <div
                                                        class="member-item"
                                                    >

                                                        <div
                                                            class="member-avatar"
                                                        >

                                                            ${escapeHTML(
                                                                (
                                                                    member.name ||
                                                                    member.username ||
                                                                    "U"
                                                                )
                                                                    .charAt(0)
                                                                    .toUpperCase()
                                                            )}

                                                        </div>


                                                        <div
                                                            class="member-info"
                                                        >

                                                            <strong>
                                                                ${escapeHTML(
                                                                    member.name ||
                                                                    member.username ||
                                                                    "User"
                                                                )}
                                                            </strong>


                                                            <span>

                                                                ${
                                                                    member.username
                                                                        ? "@" +
                                                                          escapeHTML(
                                                                              member.username
                                                                          )
                                                                        : ""
                                                                }

                                                            </span>

                                                        </div>

                                                    </div>

                                                `
                                            )
                                            .join("")
                                        : `
                                            <div class="no-tasks">
                                                No members added yet.
                                            </div>
                                        `
                                }

                            </div>

                        </div>


                        <!-- DATES -->

                        <div class="details-card">

                            <div class="card-heading">

                                <h2>
                                    Timeline
                                </h2>

                            </div>


                            <div class="info-grid">

                                <div class="info-item">

                                    <span>
                                        Created
                                    </span>

                                    <strong>
                                        ${formatDate(
                                            project.createdAt
                                        )}
                                    </strong>

                                </div>


                                <div class="info-item">

                                    <span>
                                        Updated
                                    </span>

                                    <strong>
                                        ${formatDate(
                                            project.updatedAt
                                        )}
                                    </strong>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            `;


            /* ========================================
               EDIT BUTTON
            ======================================== */

            const editButton =
    document.querySelector(
        "#editProjectBtn"
    );

if (editButton) {

    editButton.addEventListener(
        "click",
        function () {

            openEditModal(project);

        }
    );

}


            /* ========================================
               DELETE BUTTON
            ======================================== */

            const deleteButton =
                document.querySelector(
                    "#deleteProjectBtn"
                );


            if (deleteButton) {

                deleteButton.addEventListener(
                    "click",
                    deleteProject
                );

            }


            /* ========================================
               ADD TASK
            ======================================== */

            const addTaskButton =
                document.querySelector(
                    "#addTaskBtn"
                );


            if (addTaskButton) {

                addTaskButton.addEventListener(
                    "click",
                    function () {

                        window.location.href =
                            `/my-tasks.html?project=${encodeURIComponent(project._id)}`;

                    }
                );

            }


            loadTasks(
                project._id
            );


            renderChecklist(
                project
            );


            setupChecklist(
                project
            );

        }


        /* ========================================
           LOAD PROJECT BOARD TASKS
        ======================================== */

        async function loadTasks(id) {

            const taskList =
                document.querySelector("#taskList");

            if (!taskList) {
                return;
            }

            try {

                const response =
                    await fetch(
                        `/api/tasks/project/${encodeURIComponent(id)}`
                    );

                const data =
                    await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message ||
                        "Could not load project tasks."
                    );
                }

                const tasks =
                    Array.isArray(data.tasks)
                        ? data.tasks
                        : [];

                const columns = {
                    "To Do": [],
                    "In Progress": [],
                    "Completed": []
                };

                tasks.forEach(task => {
                    const status =
                        columns[task.status]
                            ? task.status
                            : "To Do";

                    columns[status].push(task);
                });

                const renderCard = task => {

                    const completed =
                        task.status === "Completed";

                    const priority =
                        String(task.priority || "Medium").toLowerCase();

                    const assigned =
                        task.assignedTo?.name ||
                        task.assignedTo?.username ||
                        "Unassigned";

                    const due =
                        task.dueDate
                            ? formatDate(task.dueDate)
                            : "No due date";

                    const overdue =
                        task.dueDate &&
                        !completed &&
                        new Date(task.dueDate) < new Date();

                    return `
                        <article class="task-item ${completed ? "is-completed" : ""}">

                            <button
                                type="button"
                                class="task-card-check ${completed ? "done" : ""}"
                                data-task-toggle="${escapeHTML(task._id)}"
                                title="${completed ? "Mark as To Do" : "Mark as Completed"}"
                            >
                                ${completed ? "✓" : "○"}
                            </button>

                            <div class="task-info">

                                <strong>
                                    ${escapeHTML(task.title)}
                                </strong>

                                <span>
                                    ${escapeHTML(assigned)}
                                </span>

                                <div class="task-card-meta">
                                    <span class="task-card-tag ${priority}">
                                        ${escapeHTML(task.priority || "Medium")}
                                    </span>
                                </div>

                                <div class="task-card-due ${overdue ? "overdue" : ""}">
                                    ${overdue ? "⚠ Overdue · " : ""}${escapeHTML(due)}
                                </div>

                            </div>

                        </article>
                    `;
                };

                const renderColumn = (title, items) => `
                    <div class="task-board-column">

                        <h3>
                            ${title} · ${items.length}
                        </h3>

                        <div class="task-board-cards">
                            ${
                                items.length
                                    ? items.map(renderCard).join("")
                                    : `<div class="no-tasks">No tasks</div>`
                            }
                        </div>

                    </div>
                `;

                taskList.innerHTML = `
                    <div class="task-board">
                        ${renderColumn("To Do", columns["To Do"])}
                        ${renderColumn("In Progress", columns["In Progress"])}
                        ${renderColumn("Completed", columns["Completed"])}
                    </div>
                `;

                taskList
                    .querySelectorAll("[data-task-toggle]")
                    .forEach(button => {

                        button.addEventListener(
                            "click",
                            async function () {

                                const taskId =
                                    this.dataset.taskToggle;

                                const isDone =
                                    this.classList.contains("done");

                                try {

                                    const updateResponse =
                                        await fetch(
                                            `/api/tasks/${encodeURIComponent(taskId)}`,
                                            {
                                                method: "PUT",
                                                headers: {
                                                    "Content-Type": "application/json"
                                                },
                                                body: JSON.stringify({
                                                    status:
                                                        isDone
                                                            ? "To Do"
                                                            : "Completed"
                                                })
                                            }
                                        );

                                    if (!updateResponse.ok) {
                                        const updateData =
                                            await updateResponse.json();

                                        throw new Error(
                                            updateData.message ||
                                            "Could not update task."
                                        );
                                    }

                                    await loadTasks(id);

                                } catch (error) {

                                    console.error(
                                        "Project task update error:",
                                        error
                                    );

                                    alert(
                                        error.message ||
                                        "Could not update task."
                                    );

                                }

                            }
                        );

                    });

            } catch (error) {

                console.error(
                    "Load tasks error:",
                    error
                );

                taskList.innerHTML = `
                    <div class="no-tasks">
                        Could not load project tasks.
                    </div>
                `;

            }

        }


        /* ========================================
           EDIT MODAL
        ======================================== */

        function openEditModal(
            project
        ) {

            document
                .querySelector("#editName")
                .value =
                    project.name || "";


            document
                .querySelector("#editDescription")
                .value =
                    project.description || "";


            document
                .querySelector("#editCategory")
                .value = project.category || "";


            document
                .querySelector("#editPriority")
                .value = project.priority || "";


            document
                .querySelector("#editStatus")
                .value =
                    project.status || "";


            document
                .querySelector("#editStartDate")
                .value =
                    project.startDate
                        ? project.startDate.substring(
                            0,
                            10
                        )
                        : "";


            document
                .querySelector("#editDueDate")
                .value =
                    project.dueDate
                        ? project.dueDate.substring(
                            0,
                            10
                        )
                        : "";


            document
                .querySelector("#editColor")
                .value =
                    project.color ||
                    "#7c3aed";


            const editMessage =
                document.querySelector(
                    "#editMessage"
                );


            if (editMessage) {

                editMessage.textContent =
                    "";

                editMessage.className =
                    "form-message";

            }


            document
                .querySelector("#editModal")
                .classList
                .add("show");

        }


        /* ========================================
           CLOSE MODAL
        ======================================== */

        function closeEditModal() {

            document
                .querySelector("#editModal")
                .classList
                .remove("show");

        }


        document
            .querySelector(
                "#closeEditModal"
            )
            .addEventListener(
                "click",
                closeEditModal
            );


        document
            .querySelector(
                "#cancelEdit"
            )
            .addEventListener(
                "click",
                closeEditModal
            );


        document
            .querySelector(
                "#editModal"
            )
            .addEventListener(
                "click",
                function (event) {

                    if (
                        event.target ===
                        this
                    ) {

                        closeEditModal();

                    }

                }
            );


        /* ========================================
           SAVE EDIT
        ======================================== */

        document
            .querySelector(
                "#editProjectForm"
            )
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const editMessage =
                        document.querySelector(
                            "#editMessage"
                        );


                    const updateData = {

                        name:
                            document
                                .querySelector(
                                    "#editName"
                                )
                                .value
                                .trim(),


                        description:
                            document
                                .querySelector(
                                    "#editDescription"
                                )
                                .value
                                .trim(),


                        category:
                            document
                                .querySelector(
                                    "#editCategory"
                                )
                                .value,


                        priority:
                            document
                                .querySelector(
                                    "#editPriority"
                                )
                                .value,


                        status:
                            document
                                .querySelector(
                                    "#editStatus"
                                )
                                .value,


                        startDate:
                            document
                                .querySelector(
                                    "#editStartDate"
                                )
                                .value ||
                            null,


                        dueDate:
                            document
                                .querySelector(
                                    "#editDueDate"
                                )
                                .value ||
                            null,


                        color:
                            document
                                .querySelector(
                                    "#editColor"
                                )
                                .value

                    };


                    /* --------------------------------
                       VALIDATION
                    -------------------------------- */

                    if (
                        !updateData.name ||
                        !updateData.description ||
                        !updateData.category ||
                        !updateData.priority ||
                        !updateData.status
                    ) {

                        editMessage.textContent =
                            "Please fill in all required fields.";


                        editMessage.className =
                            "form-message error";


                        return;

                    }


                    try {

                        const response =
                            await fetch(
                                `/api/projects/${encodeURIComponent(projectId)}`,
                                {

                                    method: "PUT",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            updateData
                                        )

                                }
                            );


                        const data =
                            await response.json();


                        if (
                            !response.ok ||
                            !data.success
                        ) {

                            throw new Error(
                                data.message ||
                                "Could not update project."
                            );

                        }


                        closeEditModal();


                        await loadProject();


                    } catch (error) {

                        console.error(
                            "Update project error:",
                            error
                        );


                        editMessage.textContent =
                            error.message ||
                            "Could not update project.";


                        editMessage.className =
                            "form-message error";

                    }

                }
            );


        /* ========================================
           DELETE PROJECT
        ======================================== */

        async function deleteProject() {

            const confirmed =
                window.confirm(
                    "Are you sure you want to delete this project? All tasks and comments belonging to this project will also be deleted."
                );


            if (!confirmed) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/projects/${encodeURIComponent(projectId)}`,
                        {
                            method: "DELETE"
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Could not delete project."
                    );

                }


                window.location.href =
                    "/project.html";


            } catch (error) {

                console.error(
                    "Delete project error:",
                    error
                );


                alert(
                    error.message ||
                    "Could not delete project."
                );

            }

        }


        /* ========================================
           LOGOUT
        ======================================== */

        window.logoutUser =
            function () {

                localStorage.removeItem(
                    "taskflowUser"
                );


                window.location.href =
                    "/index.html";

            };


        /* ========================================
           START
        ======================================== */

        loadProject();

    }

);

</script>
</body>

</html>
